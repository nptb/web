<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>giao diện apple</title>
    <style>
        /* 1. Reset và Font chữ hệ thống của Apple */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        /* 2. Thanh thông báo Quốc gia (#QuocGia) */
        #QuocGia {
            background-color: #f5f5f7;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            border-bottom: 1px solid #d2d2d7;
            gap: 15px;
        }

        #QuocGia p {
            margin: 0;
            color: #1d1d1f;
        }

        #QuocGia select {
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid #d2d2d7;
            background-color: white;
            font-size: 12px;
            outline: none;
        }

        #QuocGia button {
            background-color: #1d1d1f;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        #QuocGia a {
            font-size: 20px;
            color: #424245;
            text-decoration: none;
            cursor: pointer;
            line-height: 1;
        }

        /* 3. Thanh Navigation (#navigation) */
        #navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            padding: 12px 0;
            background-color: #ffffff;
        }

        #navigation a {
            text-decoration: none;
            color: #424245;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s;
        }

        #navigation a:hover {
            color: #000000;
        }

        /* Icon táo và các icon cuối to hơn chút */
        #navigation a:first-child { font-size: 18px; color: #000; }
        #navigation a:nth-last-child(2), 
        #navigation a:last-child { font-size: 14px; }

        /* 4. Vùng Nội Dung Chính (#NoiDung) */
        #NoiDung {
            background-color: #f5f5f7;
            text-align: center;
            padding-top: 60px;
        }

        #NoiDung h1 {
            font-size: 56px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.005em;
        }

        #NoiDung h2 {
            font-size: 28px;
            font-weight: 400;
            margin: 10px 0 30px 0;
        }

        /* Style riêng cho 2 nút bấm trong nội dung */
        #NoiDung button {
            font-size: 17px;
            padding: 12px 25px;
            border-radius: 980px; /* Bo tròn dạng kẹo (pill-shape) */
            cursor: pointer;
            margin: 0 10px;
            transition: all 0.3s;
        }

        /* Nút Learn more (Nút thứ nhất) */
        #NoiDung button:nth-of-type(1) {
            background-color: #0071e3;
            color: white;
            border: none;
        }

        #NoiDung button:nth-of-type(1):hover {
            background-color: #0077ed;
        }

        /* Nút Buy (Nút thứ hai) */
        #NoiDung button:nth-of-type(2) {
            background-color: transparent;
            color: #0071e3;
            border: 1px solid #0071e3;
        }

        #NoiDung button:nth-of-type(2):hover {
            background-color: #0071e3;
            color: white;
        }

        /* Hình ảnh */
        #NoiDung img {
            display: block;
            margin: 40px auto 0 auto;
            max-width: 90%;
            height: auto;
        }

        /* Responsive cho di động */
        @media (max-width: 768px) {
            #navigation { gap: 15px; overflow-x: auto; justify-content: flex-start; padding: 12px 20px; }
            #NoiDung h1 { font-size: 40px; }
            #NoiDung h2 { font-size: 20px; }
        }
    </style>
</head>

<body>

    <div id="QuocGia" >

        <p>
            Chọn quốc gia hoặc khu vực khác để xem nội dung dành riêng cho vị trí của bạn và mua sắm trực tuyến.
        </p>

        <select>
            <option>Việt Nam</option>
            <option>United States</option>
            <option>Japan</option>
        </select>

        <button>Tiếp Tục</button>

        <a title="Đóng">&times;</a>

    </div>


    <div id="navigation">
        <a>🍎</a>
        <a>Store</a>
        <a>Mac</a>
        <a>iPad</a>
        <a>iPhone</a>
        <a>Watch</a>
        <a>Vision</a>
        <a>AirPods</a>
        <a>TV & Home</a>
        <a>Entertainment</a>
        <a>Accessories</a>
        <a>Support</a>
        <a>🔍</a>
        <a>🛒</a>
    
    </div>


    <div id="NoiDung">
    
        <h1>MacBook Neo</h1>

        <h2>Amazing Mac. Surprising price.</h2>

        <button>Learn more</button>

        <button>Buy</button>

        <p></p>

        <img src="https://store.storeimages.cdn-apple.com/1/as-images.apple.com/is/macbook-neo-color-unselect-202603-gallery-1?wid=5120&hei=3280&fmt=webp&qlt=90&.v=TytZbDBUUnRqRElRcFlBSHpmZVVDK3BoR2lIdGdhMDNQSUZrOHIycWd6Vmd1bjBBbHBBMFNjNjVIN0pUcUg2U0tZMGFKbG9yanhQdjZDS1dZUFFhRVE4bm1RcmlWRWp2eDN1WHNkSjNmUmFub3B6RFdCcnJtSHE1TzBCb3pCcis&traceId=1"
        width="800"  
        alt="MacBook Neo">
                
    </div>


</body>
</html>
